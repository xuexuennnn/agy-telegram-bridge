name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: |
          install -d "$RUNNER_TEMP/agy-bin" "$RUNNER_TEMP/agy-state"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/agy-bin/agy"
          chmod 755 "$RUNNER_TEMP/agy-bin/agy"
          : > "$RUNNER_TEMP/agy-state/antigravity-oauth-token"
          chmod 600 "$RUNNER_TEMP/agy-state/antigravity-oauth-token"
          echo "AGY_BIN=$RUNNER_TEMP/agy-bin/agy" >> "$GITHUB_ENV"
          echo "AGY_STATE_DIR=$RUNNER_TEMP/agy-state" >> "$GITHUB_ENV"
          echo "AGY_TOKEN_PATH=$RUNNER_TEMP/agy-state/antigravity-oauth-token" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -q
      - run: python -m py_compile bot.py rescue_core.py tests/test_*.py
      - run: if command -v systemd-analyze >/dev/null 2>&1; then scripts/verify-unit.sh; fi
